[package]
name = "ledgernomics"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Filesystem YAML ledger MCP for budgeted micro-slices and context recovery"
repository = "https://github.com/tycheung/ledgernomics"
readme = "README.md"

[[bin]]
name = "ledgernomics"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.4.1", features = ["server", "transport-io", "macros", "schemars"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "io-util", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
